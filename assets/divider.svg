<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="presentation">
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfe6ff"/><stop offset="0.4" stop-color="#4f93e6"/><stop offset="0.8" stop-color="#14408f"/><stop offset="1" stop-color="#021a4a"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect y="4" width="1200" height="6" rx="3"/></clipPath>
</defs>
<rect y="4" width="1200" height="6" rx="3" fill="url(#bar)"/>
<g clip-path="url(#c)"><rect y="4" width="220" height="6" fill="url(#shine)"><animate attributeName="x" values="-220;1200" dur="4.5s" repeatCount="indefinite"/></rect></g>
</svg>
